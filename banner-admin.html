<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮播图管理</title>
    <script>
    /* 主题初始化：localStorage 优先，其次跟随系统深浅色偏好（在渲染前执行，避免闪白） */
    (function () {
      var saved = null
      try { saved = localStorage.getItem('billiards-theme') } catch (e) {}
      var theme = saved === 'dark' || saved === 'light'
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      var root = document.documentElement
      root.classList.remove('light', 'dark')
      root.classList.add(theme)
    })()
    </script>
    <style>
      /* 精简设计令牌（与各页内联 theme-vars 同源取值） */
      :root {
        --background-50: #ffffff; --background-100: #f7f7fa; --background-200: #f2f2f7;
        --background-300: #e5e5ea; --background-700: #3a3a3c; --background-800: #1c1c1e;
        --text-400: #8e8e93; --text-800: #1d1d1f; --brand-500: #007aff;
        --state-error: #ff3b30; --success: #34c759;
        --background: var(--background-50);
        --foreground: var(--text-800);
        --card: var(--background-50);
        --primary: var(--brand-500);
        --primary-foreground: #ffffff;
        --secondary: var(--background-200);
        --muted-foreground: var(--text-400);
        --border: var(--background-300);
        --sidebar: var(--background-200);
        --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
        --radius: 1.2rem;
        --spacing: 4px;
        --shadow-sm: 0 1px 3px 0 rgba(0,0,0,.06);
        --shadow-lg: 0 12px 28px -8px rgba(0,0,0,.12);
      }
      .dark {
        --background: #1c1c1e; --foreground: #f5f5f7; --card: #2c2c2e;
        --primary: #3dd685; --primary-foreground: #0a1f14; --secondary: #2c2c2e;
        --muted-foreground: #8e8e93; --border: #3a3a3c; --state-error: #ff453a;
        --sidebar: #1c1c1e;
        --shadow-sm: 0 1px 3px 0 rgba(0,0,0,.3);
        --shadow-lg: 0 12px 28px -8px rgba(0,0,0,.4);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        background: var(--background); color: var(--foreground);
        font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      main { padding-bottom: 64px; }
      .page-container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

      /* ── 导航基础件（与积分榜页设计系统段同源）：rail 布局 + link 胶囊 ── */
      .rail { display: flex; align-items: center; gap: calc(var(--spacing) * 1.5); margin-left: auto; }
      .link {
        display: inline-flex; align-items: center; justify-content: center;
        height: 32px; padding: 0 calc(var(--spacing) * 2.5); border-radius: 999px;
        color: inherit; text-decoration: none; white-space: nowrap;
        font-size: 13px; font-weight: 500;
        transition: background-color .18s ease, color .18s ease, opacity .18s ease;
      }
      .link:hover { background: var(--secondary); }
      /* ── rk-nav 覆盖层（积分榜 critical-layout 同源：52px 高、1200px 版心、sidebar 底） ── */
      .rk-nav {
        position: sticky; top: 0; z-index: 50;
        display: flex; align-items: center; gap: calc(var(--spacing) * 2);
        width: 100%; height: 52px;
        padding: 0 max(16px, calc((100% - 1200px) / 2));
        background: var(--sidebar);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
      }
      .rk-nav .brand { color: var(--foreground); display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; letter-spacing: 0.02em; }
      .brand-icon { width: 30px; height: 30px; flex: none; display: block; }
      .rk-nav .rail { margin-left: auto; }
      .rk-nav .link.is-active, .rk-nav .link.active { background: var(--primary); color: var(--primary-foreground); }
      .rk-nav .link.is-active:hover { background: var(--primary); }
      .theme-toggle {
        border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground);
        width: 30px; height: 30px; border-radius: 999px; cursor: pointer; flex: none;
        display: inline-flex; align-items: center; justify-content: center;
      }
      html:not(.dark) .theme-toggle .icon-sun { display: none; }
      html.dark .theme-toggle .icon-moon { display: none; }
      /* ── 深色覆写（积分榜同源：导航毛玻璃 + active 绿胶囊辉光） ── */
      html.dark .rk-nav {
        background: rgba(28, 28, 30, 0.85);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      }
      html.dark .rk-nav .link { border-radius: 999px; transition: all 0.2s ease; }
      html.dark .rk-nav .link.is-active, html.dark .rk-nav .link.active {
        background: var(--primary); color: var(--primary-foreground);
        box-shadow: 0 2px 12px rgba(61, 214, 133, 0.25);
      }

      .hero-section { padding: 40px 0 18px; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--primary); margin-bottom: 10px; }
      .hero-title { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
      .hero-subtitle { margin: 8px 0 0; color: var(--muted-foreground); font-size: 14px; }
      .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
      .btn {
        display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 16px;
        border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none;
        border: 1px solid var(--border); background: var(--card); color: var(--foreground);
      }
      .btn:hover { background: var(--secondary); }
      .btn.btn-primary { border: none; background: var(--primary); color: var(--primary-foreground); }
      .btn[disabled] { opacity: .45; cursor: not-allowed; }

      /* 轮播图列表：网格平铺，每项一张卡片不占整行，窄屏自动单列 */
      .ba-count { font-size: 13px; font-weight: 700; color: var(--muted-foreground); }
      .ba-count b { color: var(--foreground); }
      .ba-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 14px; }
      .ba-item {
        display: flex; align-items: center; gap: 12px;
        background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
        box-shadow: var(--shadow-sm); padding: 10px 12px;
      }
      .ba-thumb {
        width: 64px; height: 128px; flex: none; border-radius: 10px; overflow: hidden;
        background: var(--secondary); border: 1px solid var(--border);
      }
      .ba-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .ba-info { flex: 1; min-width: 0; }
      .ba-name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ba-meta { margin-top: 4px; font-size: 12px; color: var(--muted-foreground); }
      .ba-ops { display: flex; flex-direction: column; gap: 6px; flex: none; }
      .ba-ops .btn { height: 28px; padding: 0 10px; font-size: 11px; justify-content: center; }
      .ba-ops .btn.danger { color: var(--state-error); border-color: var(--state-error); }
      /* 每图时长行：数字输入 + 秒 + 保存小按钮 */
      .ba-duration { margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
      .ba-duration input[type=number] {
        width: 64px; height: 26px; padding: 0 6px; font-size: 12px; border-radius: 8px;
        border: 1px solid var(--border); background: var(--background); color: var(--foreground);
        font-family: var(--font-sans);
      }
      .ba-duration .ba-save-duration { height: 24px; padding: 0 10px; font-size: 11px; }
      /* 全局播放设置卡 */
      .ba-settings {
        margin-top: 14px; padding: 14px 16px; border-radius: var(--radius);
        background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
        display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      }
      .ba-settings .ba-settings-label { font-size: 13px; font-weight: 700; }
      .ba-settings .ba-effects { display: flex; gap: 8px; flex-wrap: wrap; }
      .ba-effects label {
        display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px;
        border: 1px solid var(--border); cursor: pointer; font-size: 13px;
        transition: background-color .15s ease;
      }
      .ba-effects input[type=radio] { margin: 0; accent-color: var(--primary); }
      .ba-effects label:has(input:checked) { background: var(--secondary); border-color: var(--primary); color: var(--foreground); }
      .ba-settings .ba-settings-meta { font-size: 12px; color: var(--muted-foreground); margin-left: auto; }
      .ba-empty {
        padding: 40px; border: 1px dashed var(--border); border-radius: var(--radius);
        text-align: center; color: var(--muted-foreground); background: var(--card); margin-top: 14px;
      }
      #ba-error {
        display: none; padding: 24px; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--card); color: var(--muted-foreground); text-align: center; margin-top: 14px;
      }

      /* 扫码上传弹层 */
      .ba-qr-tip { font-size: 13px; color: var(--muted-foreground); text-align: center; line-height: 1.8; }

      .page-footer { margin-top: 48px; padding: 24px 20px; border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; text-align: center; }

      /* ── 随机展示页面配置（#196） ── */
      .bp-section { margin-top: 34px; }
      .bp-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .bp-title { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
      .bp-sub { margin: 6px 0 0; font-size: 13px; color: var(--muted-foreground); line-height: 1.7; }
      .bp-global {
        margin-top: 14px; padding: 14px 16px; border-radius: var(--radius);
        background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      }
      .bp-switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
      .bp-switch input { width: 17px; height: 17px; accent-color: var(--primary); margin: 0; }
      .bp-global select {
        height: 30px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--background); color: var(--foreground); font-size: 13px; padding: 0 8px; font-family: var(--font-sans);
      }
      .bp-global .bp-n { width: 56px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); font-size: 13px; padding: 0 6px; font-family: var(--font-sans); }
      .bp-global-label { font-size: 13px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 6px; }
      .bp-meta { font-size: 12px; color: var(--muted-foreground); margin-left: auto; }
      .bp-list { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
      .bp-card {
        background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
        box-shadow: var(--shadow-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
      }
      .bp-card.is-on { border-color: var(--primary); }
      .bp-row1 { display: flex; align-items: center; gap: 10px; }
      .bp-check { width: 18px; height: 18px; accent-color: var(--primary); margin: 0; flex: none; }
      .bp-name { font-size: 14px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bp-tag { font-size: 11px; color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; flex: none; }
      .bp-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-left: 28px; }
      .bp-controls label { font-size: 12px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 4px; }
      .bp-controls input[type=number] {
        width: 58px; height: 26px; padding: 0 6px; font-size: 12px; border-radius: 8px;
        border: 1px solid var(--border); background: var(--background); color: var(--foreground); font-family: var(--font-sans);
      }
      .bp-controls select {
        height: 26px; font-size: 12px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--background); color: var(--foreground); padding: 0 4px; font-family: var(--font-sans);
      }
      .bp-save { margin-left: auto; height: 26px; padding: 0 12px; font-size: 11px; }
      .bp-card.is-off .bp-controls { opacity: .55; }
      .bp-loading { padding: 24px; text-align: center; color: var(--muted-foreground); font-size: 13px; }
      /* 窄屏导航兼容由 common.js 全站统一注入（横向可滑，保留全部入口） */
      @media (max-width: 640px) {
        .hero-title { font-size: 24px; }
        .ba-thumb { width: 54px; height: 108px; }
        .bp-meta { margin-left: 0; width: 100%; }
      }
    </style>
</head>
<body>
  <main>
    <!-- Top Navigation Bar -->
    <nav class="webbar rk-nav" aria-label="台球协会主导航">
      <span class="brand"><svg class="brand-icon" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" style="fill:var(--primary)"/><circle cx="18" cy="18" r="10.5" style="fill:#ffffff"/><circle cx="18" cy="18" r="5" style="fill:var(--primary)"/></svg>台球协会</span>
      <div class="rail">
        <a class="link" href="#">积分排行</a>
        <a class="link" href="#">对战记录</a>
        <a class="link" href="#">比赛</a>
        <a class="link" href="#">轮播图</a>
        <a class="link" href="#">练球图</a>
        <a class="link" href="#">会员详情</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色/浅色主题" title="切换深色/浅色主题">
          <i data-lucide="moon" class="icon-moon" style="width:16px;height:16px;"></i>
          <i data-lucide="sun" style="width:16px;height:16px;"></i>
        </button>
      </div>
    </nav>

    <div class="page-container">
      <section class="hero-section">
        <div class="eyebrow">BANNER ADMIN</div>
        <h1 class="hero-title">轮播图管理</h1>
        <p class="hero-subtitle">展示页在 1080×1920 竖屏设备全幅轮播；建议上传竖版图片（宽高比约 9:16），最多 <span id="ba-max">10</span> 张。</p>
        <div class="hero-actions">
          <button class="btn btn-primary" id="ba-upload" type="button">
            <i data-lucide="upload" style="width:16px;height:16px;"></i>
            本地上传图片
          </button>
          <button class="btn" id="ba-qr" type="button">
            <i data-lucide="qr-code" style="width:16px;height:16px;"></i>
            微信扫码上传
          </button>
          <a class="btn" href="./banner.html" target="_blank" rel="noopener">
            <i data-lucide="play" style="width:16px;height:16px;"></i>
            打开展示页
          </a>
        </div>
        <input type="file" id="ba-file" accept="image/jpeg,image/png,image/webp" multiple style="display:none;">
      </section>

      <div class="ba-count">已上传 <b id="ba-n">0</b> / <span id="ba-max2">10</span> 张<span id="ba-hint" style="margin-left:10px;"></span></div>

      <!-- 全局播放设置：切换效果（fade/slide/none），展示页每次拉列表时读取 -->
      <section class="ba-settings" id="ba-settings" style="display:none;">
        <span class="ba-settings-label">切换效果</span>
        <div class="ba-effects" id="ba-effects">
          <label><input type="radio" name="ba-effect" value="fade"> 淡入淡出</label>
          <label><input type="radio" name="ba-effect" value="slide"> 左右滑动</label>
          <label><input type="radio" name="ba-effect" value="none"> 直接切换</label>
        </div>
        <button class="btn" id="ba-save-settings" type="button">保存设置</button>
        <span class="ba-settings-meta" id="ba-settings-meta"></span>
      </section>

      <section id="ba-error">
        <div id="ba-error-text">加载失败</div>
        <button class="btn" id="ba-retry" type="button" style="margin-top:14px;">重试</button>
      </section>

      <div class="ba-list" id="ba-list"></div>
      <div class="ba-empty" id="ba-empty" style="display:none;">暂无轮播图，点击上方按钮上传第一张</div>

      <!-- 随机展示页面：图片轮播之外，随机插入网站页面（独立配置，不占 10 张图片名额） -->
      <section class="bp-section" id="bp-section" style="display:none;">
        <div class="bp-head">
          <span class="bp-title">随机展示页面</span>
        </div>
        <p class="bp-sub">整轮图片播完后，随机插入一个已勾选页面在电子板上展示；独立配置，<b>不占用上方 10 张轮播图名额</b>。页面以无导航的展示模式嵌入，长页面会随机跳视到不同段落。</p>

        <div class="bp-global">
          <label class="bp-switch"><input type="checkbox" id="bp-enabled"> 启用随机页面</label>
          <span class="bp-global-label">插入时机
            <select id="bp-insert-mode">
              <option value="after_cycle">每轮图片播完后</option>
              <option value="every_n">每 N 张图片</option>
              <option value="probability">按概率</option>
            </select>
          </span>
          <span class="bp-global-label" id="bp-n-wrap" style="display:none;"><input type="number" class="bp-n" id="bp-insert-n" min="1" max="100" step="1"> <span id="bp-n-suffix">页</span></span>
          <label class="bp-switch"><input type="checkbox" id="bp-jump"> 老式设备允许整页跳转兜底</label>
          <button class="btn btn-primary" id="bp-save-global" type="button" style="height:30px;">保存策略</button>
          <span class="bp-meta" id="bp-meta"></span>
        </div>

        <div class="bp-list" id="bp-list"><div class="bp-loading">页面配置加载中…</div></div>
      </section>
    </div>

    <footer class="page-footer">© 2026 台球协会. 保留所有权利.</footer>
  </main>

  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
  <script src="./js/cloud.js?v=20260926a"></script>
  <script src="./js/fallback-data.js?v=20261008b"></script>
  <script src="./js/common.js?v=20261105a"></script>
  <script src="./js/auth.js?v=20261101b"></script>
  <script src="./js/banner-admin.js?v=20261105a"></script>
  <script>
  /* 主题切换：更新 <html> class + localStorage 记忆，并广播 themechange 事件 */
  (function () {
    var btn = document.getElementById('theme-toggle')
    if (!btn) return
    btn.addEventListener('click', function () {
      var root = document.documentElement
      var next = root.classList.contains('dark') ? 'light' : 'dark'
      root.classList.remove('light', 'dark')
      root.classList.add(next)
      try { localStorage.setItem('billiards-theme', next) } catch (e) {}
      document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: next } }))
    })
    window.AppUI.fixNav('banner')
  })()
  </script>
</body>
</html>
