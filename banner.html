<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>轮播图</title>
    <script>
    /* 主题初始化：localStorage 优先，其次跟随系统深浅色偏好（在渲染前执行，避免闪白） */
    (function () {
      var saved = null
      try { saved = localStorage.getItem('billiards-theme') } catch (e) {}
      var theme = saved === 'dark' || saved === 'light'
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      var root = document.documentElement
      root.classList.remove('light', 'dark')
      root.classList.add(theme)
    })()
    </script>
    <style>
      /* 精简设计令牌（与各页内联 theme-vars 同源取值） */
      :root {
        --background-50: #ffffff; --background-100: #f7f7fa; --background-200: #f2f2f7;
        --background-300: #e5e5ea; --background-700: #3a3a3c; --background-800: #1c1c1e;
        --text-400: #8e8e93; --text-800: #1d1d1f; --brand-500: #007aff;
        --state-error: #ff3b30;
        --background: var(--background-50);
        --foreground: var(--text-800);
        --card: var(--background-50);
        --primary: var(--brand-500);
        --primary-foreground: #ffffff;
        --secondary: var(--background-200);
        --muted-foreground: var(--text-400);
        --border: var(--background-300);
        --sidebar: var(--background-200);
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05);
        --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
        --radius: 1.2rem;
        --spacing: 4px;
      }
      .dark {
        --background: #1c1c1e; --foreground: #f5f5f7; --card: #2c2c2e;
        --primary: #3dd685; --primary-foreground: #0a1f14; --secondary: #2c2c2e;
        --muted-foreground: #8e8e93; --border: #3a3a3c; --state-error: #ff453a;
        --sidebar: #1c1c1e;
        --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px -1px rgba(0, 0, 0, 0.2);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; } /* 精确高度链（不依赖 vh 单位，IE6 起全兼容），供 flex:1 精确分配 */
      body {
        margin: 0; display: flex; flex-direction: column;
        overflow: hidden; /* 展示页无滚动需求：宁可裁切也不溢出，广告机视口异常时的硬性兜底 */
        background: var(--background); color: var(--foreground);
        font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      /* ── 导航基础件（与积分榜页设计系统段同源）：rail 布局 + link 胶囊 ── */
      .rail { display: flex; align-items: center; gap: calc(var(--spacing) * 1.5); margin-left: auto; }
      .link {
        display: inline-flex; align-items: center; justify-content: center;
        height: 32px; padding: 0 calc(var(--spacing) * 2.5); border-radius: 999px;
        color: inherit; text-decoration: none; white-space: nowrap;
        font-size: 13px; font-weight: 500;
        transition: background-color .18s ease, color .18s ease, opacity .18s ease;
      }
      .link:hover { background: var(--secondary); }
      /* ── rk-nav 覆盖层（积分榜 critical-layout 同源：52px 高、1200px 版心、sidebar 底） ── */
      .rk-nav {
        position: sticky; top: 0; z-index: 50;
        display: flex; align-items: center; gap: calc(var(--spacing) * 2);
        width: 100%; height: 52px;
        padding: 0 16px; /* 老内核回退，下行 max() 生效时覆盖 */
        padding: 0 max(16px, calc((100% - 1200px) / 2));
        background: var(--sidebar);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
      }
      .rk-nav .brand { color: var(--foreground); display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; letter-spacing: 0.02em; }
      .brand-icon { width: 30px; height: 30px; flex: none; display: block; }
      .rk-nav .rail { margin-left: auto; }
      .rk-nav .link.is-active, .rk-nav .link.active { background: var(--primary); color: var(--primary-foreground); }
      .rk-nav .link.is-active:hover { background: var(--primary); }
      .theme-toggle {
        border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground);
        width: 30px; height: 30px; border-radius: 999px; cursor: pointer; flex: none;
        display: inline-flex; align-items: center; justify-content: center;
      }
      html:not(.dark) .theme-toggle .icon-sun { display: none; }
      html.dark .theme-toggle .icon-moon { display: none; }
      /* ── 深色覆写（积分榜同源：导航毛玻璃 + active 绿胶囊辉光） ── */
      html.dark .rk-nav {
        background: rgba(28, 28, 30, 0.85);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      }
      html.dark .rk-nav .link { border-radius: 999px; transition: all 0.2s ease; }
      html.dark .rk-nav .link.is-active, html.dark .rk-nav .link.active {
        background: var(--primary); color: var(--primary-foreground);
        box-shadow: 0 2px 12px rgba(61, 214, 133, 0.25);
      }

      /* 轮播舞台：占满导航与页脚之间的全部空间，1080×1920（9:16）竖屏设备全幅播放 */
      main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      #bn-stage {
        position: relative; flex: 1; min-height: 0;
        background: #000; overflow: hidden;
        -webkit-user-select: none; user-select: none; /* 拖拽切图不选中页面内容 */
        -webkit-touch-callout: none; touch-action: pan-y; /* iOS 长按不弹菜单；纵向手势不劫持，横向滑动留给页面切图 */
      }
      .bn-slide {
        position: absolute; top: 0; right: 0; bottom: 0; left: 0; /* 不用 inset 简写（2021+ 新语法，老内核不识别） */
        opacity: 0; transition: opacity 1s ease;
        display: flex; justify-content: center; /* 渐进增强：新内核 flex 居中，过宽图两边均裁 */
      }
      .bn-slide.is-active { opacity: 1; }
      /* 竖屏 9:16：高度优先充满，宽度按原图比例自适应。流式 margin 居中（不依赖 absolute/transform，
         广告机等弱内核/弱 GPU 设备全兼容；不识别 flex 的老内核自动回退 block + margin auto） */
      .bn-slide img {
        display: block; height: 100%; width: auto; max-width: none;
        margin: 0 auto;
        -webkit-user-drag: none; /* 鼠标拖拽切图时不拖出系统图片 */
      }
      /* 切换效果：slide 平移（新图右入、旧图左出，no-tx 供旧片无过渡归位）/ none 直切 */
      body.bn-fx-slide .bn-slide {
        opacity: 1;
        -webkit-transform: translateX(100%); transform: translateX(100%);
        -webkit-transition: -webkit-transform .8s cubic-bezier(.32,.72,.35,1);
        transition: transform .8s cubic-bezier(.32,.72,.35,1);
      }
      /* 反向（上一张/右滑）：旧片右出、新片左入。声明在 is-active 之前——类并存时以 is-active 为准 */
      body.bn-fx-slide .bn-slide.is-prev-r { -webkit-transform: translateX(100%); transform: translateX(100%); }
      body.bn-fx-slide .bn-slide.is-enter-l { -webkit-transform: translateX(-100%); transform: translateX(-100%); }
      body.bn-fx-slide .bn-slide.is-active { -webkit-transform: translateX(0); transform: translateX(0); }
      body.bn-fx-slide .bn-slide.is-prev { -webkit-transform: translateX(-100%); transform: translateX(-100%); }
      body.bn-fx-slide .bn-slide.bn-no-tx { -webkit-transition: none; transition: none; }
      body.bn-fx-none .bn-slide { -webkit-transition: none; transition: none; }
      /* 指示点：低存在感，仅多图时显示 */
      #bn-dots {
        position: absolute; left: 50%;
        bottom: 18px; /* 老内核回退，下行 max() 生效时覆盖 */
        bottom: max(18px, env(safe-area-inset-bottom));
        -webkit-transform: translateX(-50%);
        transform: translateX(-50%); display: none; gap: 10px; z-index: 5;
      }
      #bn-dots i {
        width: 8px; height: 8px; border-radius: 999px;
        background: rgba(255,255,255,.35); transition: background .3s ease;
      }
      #bn-dots i.on { background: rgba(255,255,255,.92); }
      /* 占位：无图或云端未连接 */
      #bn-empty {
        position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        color: rgba(255,255,255,.55); text-align: center; padding: 32px;
      }
      #bn-empty .bn-logo {
        width: 84px; height: 84px; border-radius: 22px; background: #007aff;
        display: flex; align-items: center; justify-content: center;
      }
      #bn-empty .bn-logo::after {
        content: ''; width: 40px; height: 40px; border-radius: 999px; background: #fff;
        box-shadow: inset 0 0 0 12px #007aff;
      }
      #bn-empty .bn-title { font-size: 22px; font-weight: 700; color: rgba(255,255,255,.85); }
      #bn-empty .bn-sub { font-size: 13px; line-height: 1.7; }
      /* 管理入口：舞台右上角小圆钮，低透明不抢画面，悬停/触按显现 */
      #bn-admin {
        position: absolute;
        top: 14px; /* 老内核回退，下行 max() 生效时覆盖 */
        top: max(14px, env(safe-area-inset-top)); right: 14px;
        width: 34px; height: 34px; border-radius: 999px; z-index: 10;
        background: rgba(255,255,255,.14); color: rgba(255,255,255,.7);
        display: flex; align-items: center; justify-content: center;
        text-decoration: none; font-size: 15px; opacity: .18; transition: opacity .2s ease;
      }
      #bn-admin:hover, #bn-admin:active { opacity: .85; }
      /* 显示比例切换：舞台左上角，与管理入口同款低透明 */
      #bn-mode {
        position: absolute;
        top: 14px; /* 老内核回退，下行 max() 生效时覆盖 */
        top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 10;
        height: 34px; padding: 0 12px; border: none; border-radius: 999px; cursor: pointer;
        background: rgba(255,255,255,.14); color: rgba(255,255,255,.7);
        font-family: var(--font-sans); font-size: 12px; font-weight: 700; letter-spacing: .04em;
        opacity: .18; transition: opacity .2s ease;
      }
      #bn-mode:hover, #bn-mode:active { opacity: .85; }
      /* 全屏切换：舞台右上角、管理入口左侧，同款低透明 */
      #bn-full {
        position: absolute;
        top: 14px; /* 老内核回退，下行 max() 生效时覆盖 */
        top: max(14px, env(safe-area-inset-top)); right: 56px; z-index: 10;
        width: 34px; height: 34px; border: none; border-radius: 999px; cursor: pointer;
        background: rgba(255,255,255,.14); color: rgba(255,255,255,.7);
        font-family: var(--font-sans); font-size: 15px; line-height: 1;
        opacity: .18; transition: opacity .2s ease;
      }
      #bn-full:hover, #bn-full:active { opacity: .85; }
      /* 主动刷新：舞台右上角、全屏钮左侧，同款低透明；点击清本地缓存强制重拉最新图片 */
      #bn-refresh {
        position: absolute;
        top: 14px; /* 老内核回退，下行 max() 生效时覆盖 */
        top: max(14px, env(safe-area-inset-top)); right: 98px; z-index: 10;
        width: 34px; height: 34px; border: none; border-radius: 999px; cursor: pointer;
        background: rgba(255,255,255,.14); color: rgba(255,255,255,.7);
        font-family: var(--font-sans); font-size: 17px; line-height: 1;
        opacity: .18; transition: opacity .2s ease;
      }
      #bn-refresh:hover, #bn-refresh:active { opacity: .85; }
      #bn-refresh.bn-busy { opacity: .85; }
      /* 全屏模式：隐藏顶部导航与底部信息，舞台占满全屏，仅保留角落按钮 */
      body.bn-fullscreen .rk-nav,
      body.bn-fullscreen .page-footer { display: none; }

      /* 横屏 16:9 模式：舞台占满导航以下全屏高度，图片保持原长宽比完整显示（contain），两侧黑边填充 */
      body.bn-landscape main { background: #000; }
      body.bn-landscape .bn-slide img {
        width: 100%; height: 100%; object-fit: contain;
      }

      /* ── 随机展示页面层（#196）：iframe 无导航嵌入 + 整页跳转兜底提示 ── */
      #bn-page {
        position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 8;
        background: #000; display: none;
      }
      #bn-page.is-active { display: block; }
      #bn-page iframe {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        border: 0; background: var(--background);
      }
      /* 竖屏 9:16 页面容器：内容按 9:16 比例顶满高度，水平居中，外侧黑边（与图片口径一致） */
      #bn-page-framewrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
      #bn-page.is-loading iframe { visibility: hidden; }
      #bn-page-hint {
        position: absolute; top: 0; right: 0; bottom: 0; left: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        color: rgba(255,255,255,.72); background: #000; text-align: center; padding: 32px;
      }
      #bn-page-hint { display: none; }
      #bn-page.is-loading #bn-page-hint { display: flex; }
      #bn-page-hint .bp-spin {
        width: 38px; height: 38px; border-radius: 999px;
        border: 3px solid rgba(255,255,255,.22); border-top-color: #fff;
        -webkit-animation: bn-spin .8s linear infinite; animation: bn-spin .8s linear infinite;
      }
      @-webkit-keyframes bn-spin { to { -webkit-transform: rotate(360deg); } }
      @keyframes bn-spin { to { transform: rotate(360deg); } }
      #bn-page-hint .bp-ht { font-size: 16px; font-weight: 700; color: rgba(255,255,255,.9); }
      #bn-page-hint .bp-hs { font-size: 13px; color: rgba(255,255,255,.55); }
      /* 页面展示中：暂停指示点与图片层的交互干扰（页面层在上，触摸自然被 iframe 接管） */
      body.bn-page-on { touch-action: none; }

      .page-footer { padding: 16px 20px; border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; text-align: center; }
      /* 窄屏导航兼容由 common.js 全站统一注入（横向可滑，保留全部入口） */
    </style>
</head>
<body>
  <!-- Top Navigation Bar -->
  <nav class="webbar rk-nav" aria-label="台球协会主导航">
    <span class="brand"><svg class="brand-icon" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" style="fill:var(--primary)"/><circle cx="18" cy="18" r="10.5" style="fill:#ffffff"/><circle cx="18" cy="18" r="5" style="fill:var(--primary)"/></svg>台球协会</span>
    <div class="rail">
      <a class="link" href="#">积分排行</a>
      <a class="link" href="#">对战记录</a>
      <a class="link" href="#">比赛</a>
      <a class="link" href="#">轮播图</a>
      <a class="link" href="#">练球图</a>
      <a class="link" href="#">会员详情</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色/浅色主题" title="切换深色/浅色主题">
        <i data-lucide="moon" class="icon-moon" style="width:16px;height:16px;"></i>
        <i data-lucide="sun" class="icon-sun" style="width:16px;height:16px;"></i>
      </button>
    </div>
  </nav>

  <main>
    <div id="bn-stage" aria-label="轮播图">
      <div id="bn-empty">
        <div class="bn-logo"></div>
        <div class="bn-title">林氏台球协会</div>
        <div class="bn-sub" id="bn-empty-sub">暂无轮播内容</div>
      </div>
      <div id="bn-dots" aria-hidden="true"></div>
      <div id="bn-page" aria-hidden="true">
        <div id="bn-page-framewrap"><iframe id="bn-page-frame" title="随机展示页面" referrerpolicy="no-referrer"></iframe></div>
        <div id="bn-page-hint"><div class="bp-spin"></div><div class="bp-ht" id="bn-page-ht">页面加载中</div><div class="bp-hs">若长时间未显示，将自动改为整页跳转</div></div>
      </div>
      <button id="bn-mode" type="button" title="切换显示比例">16:9</button>
      <button id="bn-refresh" type="button" title="刷新：清除本地图片缓存，重新获取最新图片" aria-label="刷新图片">↻</button>
      <button id="bn-full" type="button" title="全屏展示，隐藏顶部导航与底部信息" aria-label="全屏切换">⛶</button>
      <a id="bn-admin" href="./banner-admin.html" title="轮播图管理" aria-label="轮播图管理">⚙</a>
    </div>
  </main>

  <footer class="page-footer">© 2026 台球协会. 保留所有权利.</footer>

  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
  <script src="./js/cloud.js?v=20260926a"></script>
  <script src="./js/common.js?v=20261105a"></script>
  <script src="./js/banner.js?v=20261105a"></script>
  <script>
  /* 主题切换：更新 <html> class + localStorage 记忆，并广播 themechange 事件 */
  (function () {
    var btn = document.getElementById('theme-toggle')
    if (!btn) return
    btn.addEventListener('click', function () {
      var root = document.documentElement
      var next = root.classList.contains('dark') ? 'light' : 'dark'
      root.classList.remove('light', 'dark')
      root.classList.add(next)
      try { localStorage.setItem('billiards-theme', next) } catch (e) {}
      document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: next } }))
    })
    window.AppUI.fixNav('banner')
  })()
  </script>
</body>
</html>
